<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="holoClip"><circle cx="150" cy="150" r="130"/></clipPath>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- drop this over any image/avatar using the same clip circle -->
  <circle cx="150" cy="150" r="132" fill="none" stroke="#00E5FF" stroke-width="2" opacity="0.7">
    <animate attributeName="r" values="128;136;128" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <g clip-path="url(#holoClip)">
    <!-- one-time top-to-bottom material-in reveal -->
    <rect x="0" y="0" width="300" height="300" fill="#0D1117">
      <animate attributeName="height" values="300;0" dur="1.3s" fill="freeze"/>
    </rect>
    <!-- continuous scan sweep -->
    <rect x="0" y="-40" width="300" height="40" fill="url(#scanGrad)">
      <animate attributeName="y" values="-40;300" dur="3s" repeatCount="indefinite"/>
    </rect>
    <!-- flicker lines -->
    <rect x="0" y="80" width="300" height="2" fill="#00E5FF" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.3;0.05" dur="1.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="200" width="300" height="2" fill="#00E5FF" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.25;0.05" dur="2.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
