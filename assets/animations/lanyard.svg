<svg width="360" height="560" viewBox="0 0 360 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <radialGradient id="avatarRing" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#00000000"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </radialGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff00"/>
      <stop offset="50%" stop-color="#ffffff55"/>
      <stop offset="100%" stop-color="#ffffff00"/>
    </linearGradient>
  </defs>

  <g id="pendulum" transform="translate(180,20)">
    <animateTransform attributeName="transform" type="rotate"
      values="-22 180 20; 16 180 20; -10 180 20; 6 180 20; -3 180 20; 0 180 20; 0 180 20"
      keyTimes="0;0.12;0.28;0.45;0.62;0.8;1"
      dur="4s" begin="1.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="0,-520; 0,0" keyTimes="0;1" dur="1.4s" begin="0s" fill="freeze"
      calcMode="spline" keySplines="0.34 0 0.64 1"/>
    <animateTransform attributeName="transform" type="rotate" additive="sum"
      values="0 180 20; 2.5 180 20; 0 180 20; -2.5 180 20; 0 180 20"
      dur="3.4s" begin="5.6s" repeatCount="indefinite"/>

    <circle cx="180" cy="20" r="10" fill="#c9c9c9" stroke="#8a8a8a" stroke-width="2"/>
    <circle cx="180" cy="20" r="4" fill="#0D1117"/>

    <path d="M 165 20 L 150 260 L 210 260 L 195 20 Z" fill="url(#strapGrad)"/>
    <text x="180" y="140" font-family="Consolas, monospace" font-size="13" fill="#ffffffcc"
          text-anchor="middle" transform="rotate(90,180,140)">DEEPAK · AI/DATA · DEEPAK</text>

    <rect x="160" y="255" width="40" height="16" rx="8" fill="#c9c9c9"/>
    <circle cx="180" cy="263" r="5" fill="#8a8a8a"/>

    <g transform="translate(60,270)">
      <rect x="0" y="0" width="240" height="290" rx="18" fill="url(#cardGrad)" stroke="#7C3AED55" stroke-width="2"/>

      <circle cx="120" cy="90" r="58" fill="url(#avatarRing)">
        <animate attributeName="r" values="56;60;56" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <clipPath id="avatarClipCard"><circle cx="120" cy="90" r="50"/></clipPath>
      <image href="../images/avatar.png" x="70" y="40" width="100" height="100"
             clip-path="url(#avatarClipCard)" preserveAspectRatio="xMidYMid slice"/>
      <circle cx="120" cy="90" r="50" fill="none" stroke="#00E5FF" stroke-width="2"/>

      <text x="120" y="175" text-anchor="middle" font-family="Consolas, monospace" font-size="20"
            font-weight="bold" fill="#FFFFFF">Deepak Maurya</text>
      <text x="120" y="198" text-anchor="middle" font-family="Consolas, monospace" font-size="13"
            fill="#B0BEC5">Data Analyst · AI Engineer</text>
      <text x="120" y="218" text-anchor="middle" font-family="Consolas, monospace" font-size="12"
            fill="#7C3AED">@deep121-bit</text>

      <g transform="translate(45,240)" fill="#ffffffaa">
        <rect x="0" y="0" width="2" height="30"/><rect x="5" y="0" width="4" height="30"/>
        <rect x="12" y="0" width="1" height="30"/><rect x="16" y="0" width="3" height="30"/>
        <rect x="22" y="0" width="2" height="30"/><rect x="27" y="0" width="5" height="30"/>
        <rect x="35" y="0" width="1" height="30"/><rect x="39" y="0" width="3" height="30"/>
        <rect x="45" y="0" width="2" height="30"/><rect x="50" y="0" width="4" height="30"/>
        <rect x="57" y="0" width="1" height="30"/><rect x="61" y="0" width="2" height="30"/>
        <rect x="66" y="0" width="5" height="30"/><rect x="74" y="0" width="2" height="30"/>
        <rect x="79" y="0" width="1" height="30"/><rect x="83" y="0" width="4" height="30"/>
        <rect x="90" y="0" width="2" height="30"/><rect x="95" y="0" width="3" height="30"/>
        <rect x="101" y="0" width="1" height="30"/><rect x="105" y="0" width="4" height="30"/>
        <rect x="112" y="0" width="2" height="30"/><rect x="117" y="0" width="3" height="30"/>
        <rect x="123" y="0" width="1" height="30"/><rect x="127" y="0" width="5" height="30"/>
        <rect x="135" y="0" width="2" height="30"/><rect x="140" y="0" width="1" height="30"/>
        <rect x="144" y="0" width="3" height="30"/><rect x="150" y="0" width="2" height="30"/>
      </g>

      <clipPath id="cardClip"><rect x="0" y="0" width="240" height="290" rx="18"/></clipPath>
      <g clip-path="url(#cardClip)">
        <rect x="-260" y="0" width="80" height="290" fill="url(#shineGrad)" transform="skewX(-20)">
          <animate attributeName="x" values="-260;320" dur="3s" repeatCount="indefinite" begin="2s"/>
        </rect>
      </g>
    </g>
  </g>
</svg>
