<svg width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg">
  <!-- transparent overlay: layer this above any banner for extra floating particles -->
  <circle cx="80" cy="60" r="2" fill="#00E5FF" opacity="0.6">
    <animate attributeName="cy" values="60;20;60" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="180" r="2.5" fill="#FF4D8D" opacity="0.5">
    <animate attributeName="cy" values="180;140;180" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="420" cy="90" r="2" fill="#7C3AED" opacity="0.5">
    <animate attributeName="cy" values="90;50;90" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="250" r="3" fill="#00E5FF" opacity="0.45">
    <animate attributeName="cy" values="250;210;250" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="120" r="2" fill="#FF4D8D" opacity="0.5">
    <animate attributeName="cy" values="120;80;120" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="950" cy="300" r="2.5" fill="#7C3AED" opacity="0.5">
    <animate attributeName="cy" values="300;260;300" dur="6.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="150" r="2" fill="#00E5FF" opacity="0.5">
    <animate attributeName="cy" values="150;110;150" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1220" cy="320" r="3" fill="#FF4D8D" opacity="0.4">
    <animate attributeName="cy" values="320;280;320" dur="6.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="40" cy="330" r="2" fill="#7C3AED" opacity="0.45">
    <animate attributeName="cy" values="330;290;330" dur="4.8s" repeatCount="indefinite"/>
  </circle>
</svg>
